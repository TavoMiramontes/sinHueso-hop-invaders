//  Audio chiptune: todo generado con Web Audio API

const SND = {
  ac: null, out: null,
  muted: localStorage.getItem('sh_mute') === '1',
  ensure() {   // se crea con el primer gesto del usuario (regla de los navegadores)
    const AC = typeof window !== 'undefined' && (window.AudioContext || window.webkitAudioContext);
    if (!AC) return;
    if (!this.ac) {
      this.ac = new AC();
      this.out = this.ac.createGain();
      this.out.gain.value = 0.32;
      this.out.connect(this.ac.destination);
    }
    if (this.ac.state === 'suspended') this.ac.resume();
  },
  tone(f0, f1, dur, type, vol, delay) {
    if (this.muted || !this.ac) return;
    const t = this.ac.currentTime + (delay || 0);
    const o = this.ac.createOscillator(), g = this.ac.createGain();
    o.type = type || 'square';
    o.frequency.setValueAtTime(f0, t);
    if (f1 && f1 !== f0) o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t + dur);
    g.gain.setValueAtTime(vol || 0.5, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g); g.connect(this.out);
    o.start(t); o.stop(t + dur + 0.02);
  },
  noise(dur, vol, delay, cutoff) {
    if (this.muted || !this.ac) return;
    const t = this.ac.currentTime + (delay || 0);
    const n = Math.floor(this.ac.sampleRate * dur);
    const buf = this.ac.createBuffer(1, n, this.ac.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
    const src = this.ac.createBufferSource();
    src.buffer = buf;
    const f = this.ac.createBiquadFilter();
    f.type = 'lowpass'; f.frequency.value = cutoff || 800;
    const g = this.ac.createGain();
    g.gain.value = vol || 0.6;
    src.connect(f); f.connect(g); g.connect(this.out);
    src.start(t);
  },
};

function toggleMute() {

const MUSIC = {
  track: null, step: 0, nextT: 0,
  set(name) {
    if (this.track !== name) { this.track = name; this.step = 0; this.nextT = 0; }
  },
  stop() { this.track = null; },
  tick() {
    if (!SND.ac || SND.muted || !this.track) return;
    const now = SND.ac.currentTime;
    if (this.nextT < now - 0.2) this.nextT = now + 0.05;   // resincroniza tras pausas/mute
    let def = TRACKS[this.track];
    // en evento especial, la tonada de la casa se tematiza
    if (this.track === 'main') {
      const th = curTheme();
      if (th && th.music) def = th.music;
    }
    // en el caos final el tema del jefe se acelera
    const bpm = def.bpm * (this.track === 'boss' && S.matchLeft <= 10 ? 1.18 : 1);
    const stepDur = 60 / bpm / 2;   // corcheas
    while (this.nextT < now + 0.2) {
      const d = this.nextT - now;
      const b = def.bass[this.step % def.bass.length];
      if (b) SND.tone(b, b, stepDur * 0.9, def.bassType, def.bassVol, d);
      const l = def.lead[this.step % def.lead.length];
      if (l) SND.tone(l, l, stepDur * 0.55, 'square', def.leadVol, d);
      if (def.noise[this.step % def.noise.length]) SND.noise(0.04, 0.16, d, 3200);
      this.step++;
      this.nextT += stepDur;
    }
  },
};

// ============================================================
//  Supabase: ranking compartido entre todos los jugadores.
//  Si no hay configuración o no hay internet, el juego cae
//  automáticamente al ranking local (localStorage).
// ============================================================
const DB = {
  client: null,
  init() {
    try {
      const cfg = (typeof window !== 'undefined' && window.SH_CONFIG) || {};
      if (cfg.url && cfg.key && typeof supabase !== 'undefined') {
        this.client = supabase.createClient(cfg.url, cfg.key);
      }
    } catch (e) { this.client = null; }
  },
  withTimeout(p, ms) {
    return Promise.race([p, new Promise((_, rj) => setTimeout(() => rj(new Error('timeout')), ms))]);
  },
  sinceFor(tab) {   // fecha de corte de cada pestaña (null = sin corte)
    if (tab === 3) return null;
    const now = new Date();
    if (tab === 0) return new Date(now.getFullYear(), now.getMonth(), now.getDate()).toISOString();
    if (tab === 1) return new Date(Date.now() - 7 * 864e5).toISOString();
    // MES es el mes calendario, no 30 días rodantes: así el ranking arranca
    // de cero el día 1 y hay un "campeón de septiembre" sin borrar nada.
    return new Date(now.getFullYear(), now.getMonth(), 1).toISOString();
  },
  async fetchScores(tab) {
    let q = this.client.from('scores')
      .select('id,name,score,stars,created_at')
      .order('score', { ascending: false })
      .limit(50);
    const since = this.sinceFor(tab);
    if (since) q = q.gte('created_at', since);
    const { data, error } = await this.withTimeout(q, 6000);
    if (error) throw error;
    return data.map(r => ({ id: r.id, n: r.name, s: r.score, st: r.stars, t: Date.parse(r.created_at) }));
  },
  async saveScore(entry) {
    const { data, error } = await this.withTimeout(
      this.client.from('scores')
        .insert({ name: entry.n, score: Math.min(30000, entry.s), accuracy: entry.a,
                  kills: Math.min(500, entry.k), stars: entry.st })
        .select('id').single(), 6000);
    if (error) throw error;
    return data.id;
  },
  async fetchEvent() {
    const { data, error } = await this.withTimeout(
      this.client.from('config').select('*').eq('id', 1).single(), 6000);
    if (error) throw error;
    return data;
  },
};

const FAME_TABS = ['HOY', 'SEMANA', 'MES', 'TOTAL'];
const MESES = ['ENERO', 'FEBRERO', 'MARZO', 'ABRIL', 'MAYO', 'JUNIO', 'JULIO',
  'AGOSTO', 'SEPTIEMBRE', 'OCTUBRE', 'NOVIEMBRE', 'DICIEMBRE'];
// Qué periodo cubre cada pestaña, en palabras. Sin esto "MES" no dice si es
// septiembre o los últimos 30 días, y nadie puede comprobar el ranking.
function famePeriodLabel(tab) {
  const now = new Date();
  if (tab === 0) return now.getDate() + ' DE ' + MESES[now.getMonth()];
  if (tab === 1) return 'ÚLTIMOS 7 DÍAS';
  if (tab === 2) return MESES[now.getMonth()] + ' ' + now.getFullYear();
  return 'DESDE SIEMPRE';
}
let fameTab = 0;
let fameList = null;       // null = cargando
let fameOffline = false;   // true = mostrando respaldo local por falta de conexión
let fameSeq = 0;           // descarta respuestas viejas si cambian de pestaña rápido

async function loadFame(tab) {
  fameTab = tab;
  const seq = ++fameSeq;
  if (!DB.client) {
    fameList = periodScores(tab);
    // si hay configuración pero no cargó el cliente (sin internet), avisa
    fameOffline = !!(typeof window !== 'undefined' && window.SH_CONFIG && window.SH_CONFIG.url);
    return;
  }
  fameList = null;
  try {
    const rows = await DB.fetchScores(tab);
    if (seq !== fameSeq) return;
    fameList = rows;
    fameOffline = false;
  } catch (e) {
    if (seq !== fameSeq) return;
    fameList = periodScores(tab);
    fameOffline = true;
  }
}

function loadScores() {
  try { return JSON.parse(localStorage.getItem('sh_scores')) || []; }
  catch { return []; }
}

function saveScoreEntry(entry) {
  const all = loadScores();
  all.push(entry);
  all.sort((a, b) => b.s - a.s);
  localStorage.setItem('sh_scores', JSON.stringify(all.slice(0, 500)));
}

// Respaldo local sin conexión: usa el mismo corte que la consulta remota
// para que una pestaña muestre lo mismo con o sin internet.
function periodScores(tab) {
  const since = DB.sinceFor(tab);
  const cut = since ? Date.parse(since) : -Infinity;
  return loadScores().filter(e => e.t >= cut);
}

// Filtro básico de groserías (normaliza acentos y leet: 0→O, 3→E...)
const BAD_WORDS = ['PUTO', 'PUTA', 'PENDEJ', 'VERGA', 'MIERDA', 'CULERO', 'CHINGA',
  'JOTO', 'MAMON', 'CABRON', 'PERRA', 'ZORRA', 'PINCHE', 'MARICA',
  'FUCK', 'SHIT', 'BITCH', 'PUSSY', 'CUNT', 'NIGG', 'NAZI', 'HITLER'];
function isCleanName(name) {
  let n = name.toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
  n = n.replace(/0/g, 'O').replace(/1/g, 'I').replace(/3/g, 'E')
       .replace(/4/g, 'A').replace(/5/g, 'S').replace(/7/g, 'T')
       .replace(/[^A-Z]/g, '');
  return !BAD_WORDS.some(w => n.includes(w));
}

// Rango de la partida: ⭐ a ⭐⭐⭐
function calcStars() {
  if (S.won || S.score >= 2600) return 3;
  if (S.score >= 1200 || S.survived >= 40) return 2;
  return 1;
}

};
// Vocales acentuadas y Ñ: acento en las 2 filas superiores + letra base
const ACCENTS = { 'Á':'A','É':'E','Í':'I','Ó':'O','Ú':'U' };

function glyphRows(ch) {
  if (FONT[ch]) return { rows: FONT[ch], top: 0 };
  if (ACCENTS[ch]) return { rows: FONT[ACCENTS[ch]], top: 1 };  // top=1: lleva acento
  if (ch === 'Ñ') return { rows: FONT['N'], top: 2 };           // top=2: lleva tilde
  return { rows: FONT[' '], top: 0 };
}

function textWidth(str, px) {
  let w = 0;
  for (const ch of str) w += glyphRows(ch).rows[0].length + 1;
  return (w - 1) * px;
}

function drawText(str, x, y, px, color, align = 'left') {
  // y = borde superior de las letras (los acentos se dibujan arriba de y)
  const tw = textWidth(str, px);
  let cx = align === 'center' ? x - tw / 2 : align === 'right' ? x - tw : x;
  cx = Math.round(cx);
  y = Math.round(y);
  ctx.fillStyle = color;
  for (const ch of str) {
    const { rows, top } = glyphRows(ch);
    const gw = rows[0].length;
    for (let r = 0; r < rows.length; r++) {
      for (let c = 0; c < gw; c++) {
        if (rows[r][c] === '#') ctx.fillRect(cx + c * px, y + r * px, px, px);
      }
    }
    if (top === 1) { // acento agudo ´
      const a = Math.floor(gw / 2);
      ctx.fillRect(cx + (a + 1) * px, y - 3 * px, px, px);
      ctx.fillRect(cx + a * px, y - 2 * px, px, px);
    } else if (top === 2) { // tilde de la Ñ
      ctx.fillRect(cx + 1 * px, y - 2 * px, 2 * px, px);
      ctx.fillRect(cx + 3 * px, y - 3 * px, 2 * px, px);
    }
    cx += (gw + 1) * px;
  }
}

const SPRITE_SCALE = 3;

function makeSprite(rows, colors, scale) {
  const h = rows.length, w = rows[0].length, s = scale || SPRITE_SCALE;
  const c = document.createElement('canvas');
  c.width = w * s; c.height = h * s;
  const g = c.getContext('2d');
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const ch = rows[y][x];
      if (ch === '.') continue;
      g.fillStyle = colors[ch];
      g.fillRect(x * s, y * s, s, s);
    }
  }
  return c;
}

// Silueta blanca del sprite (flash de daño)
function makeFlash(spr) {
  const c = document.createElement('canvas');
  c.width = spr.width; c.height = spr.height;
  const g = c.getContext('2d');
  g.drawImage(spr, 0, 0);
  g.globalCompositeOperation = 'source-in';
  g.fillStyle = '#ffffff';
  g.fillRect(0, 0, c.width, c.height);
  return c;
}

//  Logo de Sin Hueso pixelizado para la pantalla de título:
//  se reduce a baja resolución y el fondo blanco se vuelve
//  transparente (requiere servirse por http, no file://)
// ============================================================
const logoCvs = document.createElement('canvas');
let logoReady = false;
if (typeof Image !== 'undefined') {
  const logoImg = new Image();
  logoImg.onload = () => {
    try {
      const R = 56;   // resolución pixel del logo
      logoCvs.width = R; logoCvs.height = R;
      const g = logoCvs.getContext('2d');
      g.drawImage(logoImg, 0, 0, R, R);
      const d = g.getImageData(0, 0, R, R);
      for (let i = 0; i < d.data.length; i += 4) {
        // blanco y casi-blanco → transparente
        if (d.data[i] > 225 && d.data[i + 1] > 225 && d.data[i + 2] > 225) {
          d.data[i + 3] = 0;
        }
      }
      g.putImageData(d, 0, 0);
      logoReady = true;
    } catch (e) { /* abierto como file://: el título queda sin logo */ }
  };
  logoImg.src = 'sh_logo.jpeg';
}

// Nebulosas: manchas de pixeles dispersos generadas al cargar
function makeNebula(wpx, hpx, colors) {
  const c = document.createElement('canvas');
  const s = 4;
  c.width = wpx * s; c.height = hpx * s;
  const g = c.getContext('2d');
  for (let y = 0; y < hpx; y++) {
    for (let x = 0; x < wpx; x++) {
      // elipse con densidad que cae hacia el borde
      const dx = (x - wpx / 2) / (wpx / 2), dy = (y - hpx / 2) / (hpx / 2);
      const d = dx * dx + dy * dy;
      if (d < 1 && Math.random() > d * 1.3) {
        g.fillStyle = colors[Math.floor(Math.random() * colors.length)];
        g.fillRect(x * s, y * s, s, s);
      }
    }
  }
  return c;
}

// Calendario anual: con el evento en "auto" (lo normal), el juego elige
// el tema según la fecha. Rangos [mes, día] inclusivos; navidad cruza
// el año. El dueño puede forzar o apagar cualquier tema desde admin.html.
const EVENT_CALENDAR = [
  { ev: 'sanvalentin', from: [2, 10],  to: [2, 14]  },
  { ev: 'aniversario', from: [6, 1],   to: [6, 30]  },   // Sin Hueso nació en junio 2023
  { ev: 'fiesta',      from: [9, 1],   to: [9, 16]  },   // Independencia
  { ev: 'oktoberfest', from: [9, 20],  to: [10, 5]  },
  { ev: 'halloween',   from: [10, 24], to: [10, 31] },
  { ev: 'muertos',     from: [11, 1],  to: [11, 2]  },
  { ev: 'fiesta',      from: [11, 15], to: [11, 20] },   // Revolución
  { ev: 'navidad',     from: [12, 1],  to: [1, 6]   },
];
function autoEvent(d) {
  const md = (d.getMonth() + 1) * 100 + d.getDate();
  for (const r of EVENT_CALENDAR) {
    const a = r.from[0] * 100 + r.from[1], b = r.to[0] * 100 + r.to[1];
    if (a <= b ? (md >= a && md <= b) : (md >= a || md <= b)) return r.ev;
  }
  return 'none';
}

let bgTheme = [];    // capa parallax extra del evento
let ambient = [];    // clima: nieve o papel picado

function applyTheme(ev) {
  if (ev === 'auto') ev = autoEvent(new Date());
  if (ev === 'independencia') ev = 'fiesta';   // nombre viejo guardado en la BD
  ACTIVE_EVENT = ev || 'none';
  const th = curTheme();
  EVENT_MUG = (th && th.mug != null) ? th.mug : null;   // null = tarro aleatorio
  bgTheme = (th && th.decor) ? initLayer(th.decor, 3, 22, 36) : [];
  ambient = [];
  if (th && th.ambient) {
    const cols = th.ambientColors ||
      (th.ambient === 'snow' ? [PAL.foam] : ['#3e8e4a', '#f4efe6', '#e04a3a']);
    for (let i = 0; i < 34; i++) {

}

// ============================================================
//  Entrada: teclado + táctil/mouse
// ============================================================
const keys = {};
let pointerX = null;   // posición X objetivo cuando hay dedo/mouse presionado
let justUnlocked = false;   // este gesto fue el que despertó el audio

addEventListener('keydown', e => {
  if (e.target && e.target.tagName === 'INPUT') return;   // el input del nombre manda
  const wasLocked = !SND.ac;
  SND.ensure();
  keys[e.code] = true;
  if (e.code === 'Space') e.preventDefault();
  if (e.code === 'KeyM') toggleMute();
  if (e.code === 'Space' || e.code === 'Enter') {
    justUnlocked = wasLocked && !!SND.ac;   // solo cuenta si el audio sí se creó
    handleAction();
    justUnlocked = false;
  }
});
addEventListener('keyup', e => {
  if (e.target && e.target.tagName === 'INPUT') return;
  keys[e.code] = false;
});

function canvasX(clientX) {
  const r = canvas.getBoundingClientRect();
  return (clientX - r.left) / r.width * W;
}
function canvasY(clientY) {
  const r = canvas.getBoundingClientRect();
  return (clientY - r.top) / r.height * H;
}
canvas.addEventListener('pointerdown', e => {
  e.preventDefault();
  const wasLocked = !SND.ac;
  SND.ensure();
  const x = canvasX(e.clientX), y = canvasY(e.clientY);
  // botón de silencio (esquina inferior derecha, en cualquier pantalla)
  if (x > W - 50 && y > H - 50) { toggleMute(); return; }
  if (S.state === 'fame') { fameTap(x, y); return; }
  pointerX = x;
  justUnlocked = wasLocked && !!SND.ac;   // solo cuenta si el audio sí se creó
  handleAction();
  justUnlocked = false;
});
canvas.addEventListener('pointermove', e => {
  if (pointerX !== null) pointerX = canvasX(e.clientX);
});
addEventListener('pointerup', () => {
  pointerX = null;
  // en móviles el audio solo se desbloquea al SOLTAR el dedo (touchend)
  SND.ensure();
});
addEventListener('pointercancel', () => { pointerX = null; });
addEventListener('touchend', () => { SND.ensure(); });

function handleAction() {
  if (S.state === 'title') {
    // el primer toque solo despierta la música del título; el segundo juega
    if (justUnlocked && !SND.muted) return;
    startGame();
  }
  else if (S.state === 'end' && S.endCooldown <= 0) {
    // resultado → captura de nombre → Salón de la Fama
    if (S.saved) showFame();
    else showNameEntry();
  }
  else if (S.state === 'fame') startGame();   // con teclado; el tap usa fameTap
}

let savingScore = false;
async function trySaveName() {
  if (savingScore) return;
  const name = (elInput.value || '').trim().toUpperCase().slice(0, 10);
  if (!name) { elMsg.textContent = '¡ESCRIBE UN NOMBRE!'; return; }

    elInput.value = '';

  }
  const acc = Math.min(100, S.shots > 0 ? Math.round(S.hits / S.shots * 100) : 0);
  const entry = { n: name, s: S.score, a: acc, k: S.kills, st: calcStars(), t: Date.now() };
  saveScoreEntry(entry);   // respaldo local siempre
  S.saved = true;
  S.lastName = name;
  S.lastSaveId = entry.t;
  S.lastRemoteId = 0;
  localStorage.setItem('sh_name', name);

  // subir al ranking compartido (si hay conexión)
  if (DB.client) {
    savingScore = true;
    const btn = document.getElementById('btnSave');
    btn.textContent = 'GUARDANDO...';
    try {

    } catch (e) {
      fameOffline = true;   // se guardó local; el ranking mostrará el respaldo
    }
    savingScore = false;
    btn.textContent = 'GUARDAR';
  }

  sfx('coin');

  showFame();
}

function endGame(won) {
  S.state = 'end';
  S.won = won;
  if (won) {
    const M = DOUBLE_POINTS ? 2 : 1;
    S.score += 500 * M;   // bonus por sobrevivir el minuto completo
    // pintas restantes y tiempo de sobra contra el jefe también pagan
    S.livesBonus = S.lives * CFG.livesBonus * M;
    S.timeBonus = (S.bossKilled ? S.bossTimeLeft * CFG.timeBonus : 0) * M;
    S.score += S.livesBonus + S.timeBonus;
  }
  // muy rara vez el borracho trolea tu victoria (solo cosmético, jaja)
  S.troll = won && Math.random() < 0.03;
  S.trollT = 0;
  S.trollHit = false;
  S.saved = false;
  S.endCooldown = 1.0;   // evita reiniciar por accidente con el mismo toque
  if (S.score > S.best) {
    S.best = S.score;
    localStorage.setItem('sh_best', String(S.best));
  }
  // la tonada del final se queda en loop hasta que empiece otra partida
  MUSIC.set(won ? 'victory' : 'defeat');
}

// ---- Generador de oleadas: la mezcla se endurece con el tiempo ----
function spawnWave() {
  S.wave++;
  const n = S.wave;
  const cols = Math.min(5 + Math.floor((n - 1) / 2), 7);
  const rows = Math.min(2 + Math.floor((n - 1) / 3), 4);
  const spacingX = 56, spacingY = 46;

  // filas de calaveras arriba (más lejos = más duras de alcanzar)
  const skullRows = n >= 5 ? 2 : n >= 2 ? 1 : 0;
  const cells = [];
  for (let gy = 0; gy < rows; gy++) {
    for (let gx = 0; gx < cols; gx++) {
      let type = 'bone';
      if (gy < skullRows) {
        // oleadas tempranas: calaveras intercaladas; después fila completa
        type = (n < 4 && gx % 2 === 1) ? 'bone' : 'skull';
      }
      cells.push({ gx, gy, type, hp: ETYPES[type].hp, alive: true, flash: 0, fireT: 0 });
    }
  }

  // latas dispersas desde la oleada 3 (disparan al jugador)
  if (n >= 3) {
    const nCans = Math.min(1 + Math.floor((n - 3) / 2), 4);
    const candidates = cells.filter(c => c.type === 'bone');
    for (let i = 0; i < nCans && candidates.length > 0; i++) {
      const idx = Math.floor(Math.random() * candidates.length);
      const c = candidates.splice(idx, 1)[0];
      c.type = 'can';
      c.hp = ETYPES.can.hp;
      c.fireT = 1.5 + Math.random() * 2.5;
    }
  }

  groups.push({
    x: (W - (cols - 1) * spacingX) / 2,
    y: -rows * spacingY,
    dir: Math.random() < 0.5 ? 1 : -1,
    speed: CFG.waveBaseSpeed + (n - 1) * CFG.waveSpeedPerWave,
    flipT: 2 + Math.random() * 3,
    spacingX, spacingY, cols, rows,
    cells, total: cells.length,
  });
}

function enemyPos(g, c) {
  return { x: g.x + c.gx * g.spacingX, y: g.y + c.gy * g.spacingY };
}

// Un enemigo deja la formación y se lanza en picada hacia el jugador
function launchDiver() {
  const withAlive = groups.filter(g => g.cells.some(c => c.alive));
  if (withAlive.length === 0) return;
  const g = withAlive[Math.floor(Math.random() * withAlive.length)];
  // las latas no se lanzan (prefieren disparar); calaveras solo desde la oleada 4
  const eligible = g.cells.filter(c =>
    c.alive && (c.type === 'bone' || (c.type === 'skull' && S.wave >= 4)));
  if (eligible.length === 0) return;
  const maxGy = Math.max(...eligible.map(c => c.gy));
  const front = eligible.filter(c => c.gy === maxGy);
  const c = front[Math.floor(Math.random() * front.length)];
  const p = enemyPos(g, c);
  if (p.y < -10) return; // aún no entra a la pantalla
  c.alive = false;
  divers.push({ x: p.x, y: p.y, vx: g.dir * 70, vy: 60, type: c.type, hp: c.hp, flash: 0 });
}

// Cerveza industrial: entra por arriba y baja rápido en zigzag
function launchBeer() {
  beers.push({
    x0: 50 + Math.random() * (W - 100),
    y: -30,
    vy: 175 + S.wave * 10,
    amp: 55 + Math.random() * 55,
    freq: 3 + Math.random() * 2,
    phase: Math.random() * Math.PI * 2,
    hp: ETYPES.beer.hp,
    flash: 0,
  });
}

function beerX(be) {
  return Math.max(20, Math.min(W - 20, be.x0 + Math.sin(be.phase) * be.amp));
}

// ============================================================
//  Update
// ============================================================
function update(dt) {
  S.time += dt;
  MUSIC.tick();

  // Fondo (siempre animado, en todas las pantallas)
  for (const b of bubbles) {
    b.y -= b.v * dt;
    b.drift += dt * 1.5;
    if (b.y < -10) { b.y = H + 10; b.x = Math.random() * W; }
  }
  for (const st of stars) {
    st.y += st.v * dt;
    if (st.y > H + 4) { st.y = -4; st.x = Math.random() * W; }
  }
  for (const nb of nebulas) {
    nb.y += nb.v * dt;
    if (nb.y > H + 40) { nb.y = -nb.spr.height - 30; nb.x = Math.random() * (W - nb.spr.width); }
  }

  // Singularidad: disco girando y materia cayendo en espiral
  sing.angle += dt * 1.1;
  for (const de of sing.debris) {
    de.r -= dt * (4 + 40 / de.r);
    de.a += dt * (46 / de.r);
    if (de.r < 9) { de.r = 36 + Math.random() * 8; de.a = Math.random() * Math.PI * 2; }
  }
  if (sing.flare > 0) sing.flare = Math.max(0, sing.flare - dt * 0.8);

  // Clima del evento (nieve / papel picado)
  for (const am of ambient) {
    am.y += am.vy * dt;
    am.phase += dt * 3;
    am.x += Math.sin(am.phase) * (am.w > 2 ? 46 : 14) * dt;
    if (am.y > H + 6) { am.y = -6; am.x = Math.random() * W; }
  }

  // Capas parallax de la etiqueta y los insumos (+ decoración del evento)
  for (const layer of [bgFar, bgMid, bgTheme]) {
    for (const it of layer) {
      it.y += it.v * dt;
      it.phase += dt;
      if (it.y > H + 40) {
        it.y = -40;
        it.x = 20 + Math.random() * (W - 40);
        it.spr = it.sprites[Math.floor(Math.random() * it.sprites.length)];
      }
    }
  }

  // El borracho flotante
  if (drunk.active) {
    drunk.x += drunk.vx * dt;
    drunk.phase += dt;
    drunk.hicT -= dt;
    if (drunk.hicT <= 0) {   // burbuja de hipo
      drunk.hicT = 1.4 + Math.random() * 1.2;
      if (bubbles.length < 34) {
        bubbles.push({ x: drunk.x + 10, y: drunk.y - 14, r: 2 + Math.random() * 2,
                       v: 26 + Math.random() * 14, drift: Math.random() * Math.PI * 2 });
      }
    }
    if (drunk.x < -50 || drunk.x > W + 50) {
      drunk.active = false;
      drunk.nextT = 18 + Math.random() * 22;
    }
  } else {
    drunk.nextT -= dt;
    if (drunk.nextT <= 0) {
      drunk.active = true;
      const fromLeft = Math.random() < 0.5;
      drunk.x = fromLeft ? -40 : W + 40;
      drunk.vx = (fromLeft ? 1 : -1) * (16 + Math.random() * 10);
      drunk.y = 130 + Math.random() * 260;
      drunk.phase = Math.random() * Math.PI * 2;
      drunk.hicT = 1;
    }
  }

  if (S.shake > 0) S.shake = Math.max(0, S.shake - dt * 24);
  if (S.flashT > 0) S.flashT = Math.max(0, S.flashT - dt);
  if (S.state === 'end' && S.endCooldown > 0) S.endCooldown -= dt;

  // ---- Cataclismo: el Rey Hueso sobrevivió, todo explota ----
  if (S.state === 'boom') {
    S.boomT -= dt;
    S.shake = 12;
    S.tension = Math.min(1, S.tension + dt);
    boss.scale = (boss.scale || 1) + dt * 0.3;   // la mano se agiganta triunfante
    S.boomSpawn -= dt;
    if (S.boomSpawn <= 0) {
      S.boomSpawn = 0.07;
      const cols = [PAL.amberHi, PAL.red, PAL.purple, PAL.greenHi];
      explode(Math.random() * W, Math.random() * H, cols[(Math.random() * cols.length) | 0], 10);
    }
    updateFx(dt);
    if (S.boomT <= 0) endGame(false);
    return;
  }

  // ---- Pantalla final: el borracho puede trolear la victoria ----
  if (S.state === 'end') {
    updateFx(dt);
    if (S.troll) {
      S.trollT += dt;
      if (!S.trollHit && S.trollT >= 3.0) {
        S.trollHit = true;   // ¡PUM! botellazo al letrero
        explode(W / 2, 225, PAL.amberHi, 24);
        explode(W / 2, 225, '#7a4e14', 18);
        S.shake = 12;
        S.flashT = 0.1;
        popups.push({ x: W / 2, y: 190, text: '¡PUM!', life: 1.2 });
        sfx('troll');
        MUSIC.set('defeat');   // hasta la música se pone triste, jaja
      }
    }
    return;
  }

  if (S.state !== 'playing') return;

  // ---- Reloj de partida ----
  S.matchLeft -= dt;
  S.survived = CFG.matchTime - Math.max(0, S.matchLeft);
  if (S.matchLeft <= 0) {
    // SOLO ganas si el Rey Hueso fue derrotado
    if (boss.state === 'fight' || boss.state === 'enter') startCataclysm();
    else endGame(true);
    return;
  }

  // ---- Jugador ----
  let move = 0;
  if (keys['ArrowLeft'] || keys['KeyA']) move -= 1;
  if (keys['ArrowRight'] || keys['KeyD']) move += 1;
  if (move !== 0) {
    player.x += move * CFG.playerSpeed * dt;
  } else if (pointerX !== null) {
    // seguir al dedo con suavizado
    player.x += (pointerX - player.x) * Math.min(1, CFG.touchFollow * dt);
  }
  player.x = Math.max(player.w / 2, Math.min(W - player.w / 2, player.x));
  if (player.invuln > 0) player.invuln -= dt;

  // temporizadores de power-ups
  if (player.weaponT > 0) {
    player.weaponT -= dt;
    if (player.weaponT <= 0) player.weapon = 'normal';
  }
  if (player.shieldT > 0) player.shieldT -= dt;

  // racha sin daño: +100 cada 15 segundos
  S.noDmgT += dt;
  if (S.noDmgT >= 15) {
    S.noDmgT -= 15;
    const rachaPts = DOUBLE_POINTS ? 200 : 100;
    S.score += rachaPts;
    popups.push({ x: player.x, y: player.y - 40, text: 'RACHA +' + rachaPts, life: 1.1 });
    sfx('coin');
  }

  // ---- Disparo automático (patrón según arma; el láser lo reemplaza) ----
  if (player.laserT <= 0) player.fireT -= dt;
  if (player.fireT <= 0) {
    player.fireT = CFG.fireInterval;
    const py = player.y - player.h / 2 - 4;
    const k = player.weapon;   // el color de la bala delata el arma
    if (k === 'hop') {
      bullets.push({ x: player.x - 9, y: py, kind: k }, { x: player.x + 9, y: py, kind: k });
      S.shots += 2;
    } else if (k === 'ipa') {
      bullets.push({ x: player.x, y: py, kind: k },
                   { x: player.x - 7, y: py, vx: -110, kind: k },
                   { x: player.x + 7, y: py, vx: 110, kind: k });
      S.shots += 3;
    } else {
      const tier = Math.min(Math.floor((S.wave - 1) / 2), sprBulletTiers.length - 1);
      bullets.push({ x: player.x, y: py, tier });
      S.shots++;
    }
    sfx('shoot');
  }
  for (const b of bullets) {
    b.y -= CFG.bulletSpeed * dt;
    if (b.vx) b.x += b.vx * dt;
  }
  bullets = bullets.filter(b => b.y > -20 && b.x > -15 && b.x < W + 15);

  // ---- Formaciones ----
  const descend = CFG.waveDescend + (S.wave - 1) * 1.5;
  for (const g of groups) {
    let minGx = Infinity, maxGx = -Infinity, anyAlive = false;
    for (const c of g.cells) {
      if (!c.alive) continue;
      anyAlive = true;
      if (c.gx < minGx) minGx = c.gx;
      if (c.gx > maxGx) maxGx = c.gx;
    }
    if (!anyAlive) { g.done = true; continue; }

    // más rápido conforme quedan menos (clásico de Invaders)
    const aliveCount = g.cells.filter(c => c.alive).length;
    const rage = 1 + (1 - aliveCount / g.total) * 0.9;
    g.x += g.dir * g.speed * rage * dt;
    g.y += descend * dt;   // descenso continuo: la presión nunca para

    // cambio de dirección aleatorio (menos predecible)
    g.flipT -= dt;
    if (g.flipT <= 0) {
      g.flipT = 2 + Math.random() * 3;
      if (Math.random() < 0.35) g.dir *= -1;
    }

    const left = g.x + minGx * g.spacingX - 20;
    const right = g.x + maxGx * g.spacingX + 20;
    if (left < 12 && g.dir < 0) { g.dir = 1; g.y += CFG.waveStepDown; }
    if (right > W - 12 && g.dir > 0) { g.dir = -1; g.y += CFG.waveStepDown; }

    for (const c of g.cells) {
      if (!c.alive) continue;
      if (c.flash > 0) c.flash -= dt;
      const p = enemyPos(g, c);
      // los que se salen por abajo desaparecen (se escaparon, sin puntos)
      if (p.y > H + 30) { c.alive = false; continue; }
      // las latas disparan cuando están en pantalla
      if (c.type === 'can' && p.y > 20) {
        c.fireT -= dt;
        if (c.fireT <= 0) {
          const base = Math.max(1.6, CFG.canFireBase - (S.wave - 1) * 0.15);
          c.fireT = base + Math.random() * 1.4;
          const vx = Math.max(-80, Math.min(80, (player.x - p.x) * 0.25));
          drops.push({ x: p.x, y: p.y + 12, vx, vy: CFG.dropSpeed + S.wave * 8 });
        }
      }
    }
  }
  groups = groups.filter(g => !g.done);

  // ---- El Rey Hueso emerge de la singularidad al segundo 40 ----
  if (!boss.spawned && S.survived >= CFG.bossAt) {
    boss.spawned = true;
    boss.state = 'enter';
    boss.t = 0;
    boss.x = sing.x; boss.y = sing.y;
    boss.hp = CFG.bossHp;
    boss.phase = 0; boss.atkT = 1.2; boss.pat = false; boss.burstN = 0;
    boss.swoop = -1; boss.swoopT = 6;   // picada de la mano
    boss.puT = 2.5;                     // power-ups que caen durante la pelea
    singularityFlare();
    sfx('bossin');
    MUSIC.set('boss');
  }
  const bossBusy = boss.state === 'enter' || boss.state === 'fight';
  // tras vencer al jefe ya no aparece ningún enemigo más
  const noSpawns = bossBusy || S.bossKilled;
  // CAOS FINAL: los últimos 10 segundos con el jefe vivo
  const chaos = boss.state === 'fight' && S.matchLeft <= 10;

  // tinte rojizo del fondo: sube con el jefe, al máximo en el caos
  const tensionTarget = bossBusy ? (chaos ? 1 : 0.55) : 0;
  S.tension += (tensionTarget - S.tension) * Math.min(1, 2 * dt);

  if (boss.state === 'enter') {
    // sale del agujero negro creciendo hasta su posición de pelea
    boss.t += dt;
    const k = Math.min(1, boss.t / 1.4);
    boss.x = sing.x + (W / 2 - sing.x) * k;
    boss.y = sing.y + (125 - sing.y) * k;
    boss.scale = 0.25 + 0.75 * k;
    if (k >= 1) { boss.state = 'fight'; boss.scale = 1; }
  } else if (boss.state === 'fight') {
    if (boss.flash > 0) boss.flash -= dt;
    const rage = 1 - boss.hp / CFG.bossHp;   // más furioso con menos vida

    if (boss.swoop >= 0) {
      // ¡picada! la mano baja a aplastarte y vuelve a subir
      boss.swoop += dt / 1.7;
      const k = Math.min(1, boss.swoop);
      boss.y = 125 + Math.sin(Math.PI * k) * 330;
      boss.x += (player.x - boss.x) * Math.min(1, 2.2 * dt);
      if (boss.swoop >= 1) {
        boss.swoop = -1;
        boss.swoopT = (4.5 + Math.random() * 2.5 - rage * 1.5) * (chaos ? 0.5 : 1);
      }
    } else {
      boss.swoopT -= dt;
      if (boss.swoopT <= 0) boss.swoop = 0;
      boss.phase += dt * (0.95 + rage * 0.8);
      boss.x = W / 2 + Math.sin(boss.phase) * 165;
      boss.y = 125 + Math.sin(S.time * 1.6) * 12;
    }
    const eyeX = boss.x, eyeY = boss.y + 12;   // el ojo de la palma

    // solo dispara cuando no está en picada
    if (boss.swoop < 0) {
      boss.atkT -= dt;
      if (boss.atkT <= 0) {
        boss.pat = !boss.pat;
        boss.atkT = (1.9 - rage * 0.8) * (chaos ? 0.55 : 1);
        if (boss.pat) {
          boss.burstN = chaos ? 6 : 4; boss.burstT = 0;   // ráfaga dirigida
        } else {
          // abanico de 7 orbes desde el ojo
          const sp = 265 + rage * 80;
          for (let i = -3; i <= 3; i++) {
            const a = i * 0.22;
            drops.push({ x: eyeX, y: eyeY, vx: Math.sin(a) * sp, vy: Math.cos(a) * sp, orb: true });
          }
        }
      }
      if (boss.burstN > 0) {
        boss.burstT -= dt;
        if (boss.burstT <= 0) {
          boss.burstT = 0.14;
          boss.burstN--;
          const dx = player.x - eyeX, dy = player.y - eyeY;
          const m = Math.hypot(dx, dy) || 1;
          const sp = 300 + rage * 90;
          drops.push({ x: eyeX, y: eyeY, vx: dx / m * sp, vy: dy / m * sp, orb: true });
        }
      }
    }

    // durante la pelea caen power-ups del cielo (no hay enemigos que los suelten)
    boss.puT -= dt;
    if (boss.puT <= 0) {
      boss.puT = 3.5 + Math.random() * 2;
      pickups.push({ x: 40 + Math.random() * (W - 80), y: -20, type: pickPowerType(), phase: 0 });
    }
  }

  // ---- CAOS FINAL: lluvia de orbes, kamikazes y botellazos ----
  if (chaos) {
    if (!S.chaosAnnounced) {
      S.chaosAnnounced = true;
      popups.push({ x: W / 2, y: 300, text: '¡CAOS FINAL!', life: 1.6 });
      popups.push({ x: W / 2, y: 330, text: '¡EL BORRACHO SE VOLVIÓ LOCO!', life: 1.6 });
      S.shake = 10;
      sfx('chaos');
    }
    // el borracho entra (o regresa) para atacar
    if (!drunk.active) {
      drunk.active = true;
      drunk.x = -30;
      drunk.vx = 45;
      drunk.y = 180 + Math.random() * 140;
      drunk.phase = 0;
      drunk.hicT = 0.5;
    }
    // lluvia de orbes desde arriba
    S.rainT -= dt;
    if (S.rainT <= 0) {
      S.rainT = 0.5;
      const rx = Math.random() * W;
      const vx = Math.max(-120, Math.min(120, (player.x - rx) * 0.3));
      drops.push({ x: rx, y: -12, vx, vy: 265, orb: true });
    }
    // huesos kamikaze
    S.kamiT -= dt;
    if (S.kamiT <= 0) {
      S.kamiT = 1.3;
      divers.push({ x: 30 + Math.random() * (W - 60), y: -20, vx: 0, vy: 130, type: 'bone', hp: 1, flash: 0 });
    }
    // el borracho lanza botellazos
    S.btlT -= dt;
    if (S.btlT <= 0 && drunk.active) {
      S.btlT = 1.2;
      const dx = player.x - drunk.x, dy = player.y - drunk.y;
      const m = Math.hypot(dx, dy) || 1;
      drops.push({ x: drunk.x, y: drunk.y, vx: dx / m * 255, vy: dy / m * 255, btl: true });
    }
  }

  // ---- Próxima oleada: llega cada cierto tiempo, se encima con la anterior ----
  // (en pausa con el Rey Hueso en escena; nunca más si ya lo venciste)
  if (!noSpawns) {
    S.nextWaveT -= dt;
    if (groups.length === 0) S.nextWaveT = Math.min(S.nextWaveT, CFG.waveDelay);
    if (S.nextWaveT <= 0) {
      spawnWave();
      S.nextWaveT = Math.max(5.5, CFG.waveInterval - S.wave * 0.6);
    }
  }

  // ---- Ataques en picada ----
  if (!noSpawns) {
    S.diveT -= dt;
    if (S.diveT <= 0) {
      launchDiver();
      S.diveT = Math.max(1.3, CFG.diveInterval - (S.wave - 1) * 0.25);
    }
  }
  const diveMax = CFG.diveSpeed + (S.wave - 1) * 15;
  for (const d of divers) {
    if (d.flash > 0) d.flash -= dt;
    d.vy = Math.min(diveMax, d.vy + 430 * dt);
    const ax = Math.sign(player.x - d.x) * 320;
    d.vx = Math.max(-190, Math.min(190, d.vx + ax * dt));
    d.x += d.vx * dt;
    d.y += d.vy * dt;
  }
  divers = divers.filter(d => d.y < H + 40 && !d.dead);

  // ---- Cervezas industriales (desde la oleada 2) ----
  if (S.wave >= 2 && !noSpawns) {
    S.beerT -= dt;
    if (S.beerT <= 0) {
      launchBeer();
      S.beerT = Math.max(1.7, CFG.beerInterval - (S.wave - 1) * 0.35);
    }
  }
  for (const be of beers) {
    if (be.flash > 0) be.flash -= dt;
    be.y += be.vy * dt;
    be.phase += be.freq * dt;
  }
  beers = beers.filter(be => be.y < H + 45 && !be.dead);

  // ---- Proyectiles enemigos ----
  for (const dr of drops) {
    dr.x += dr.vx * dt;
    dr.y += dr.vy * dt;
  }
  drops = drops.filter(dr => dr.y < H + 15 && dr.x > -15 && dr.x < W + 15 && !dr.dead);

  // ---- Power-ups cayendo ----
  for (const pu of pickups) {
    pu.y += 115 * dt;
    pu.phase += dt * 3;
    if (Math.abs(pu.x - player.x) < 30 && Math.abs(pu.y - player.y) < 28) {
      pu.dead = true;
      applyPower(pu.type);
    }
  }
  pickups = pickups.filter(pu => pu.y < H + 25 && !pu.dead);

  // ---- Colisiones bala → enemigo ----
  for (const b of bullets) {
    // el Rey Hueso primero
    if (boss.state === 'fight' &&
        Math.abs(b.x - boss.x) < 30 && Math.abs(b.y - boss.y) < 40) {
      b.dead = true;
      S.hits++;
      boss.hp--;
      boss.flash = 0.08;
      sfx('bosshit');
      if (boss.hp <= 0) defeatBoss();
      continue;
    }
    // enemigos sueltos primero (van al frente)
    for (const d of divers) {
      if (d.dead) continue;
      const t = ETYPES[d.type];
      if (Math.abs(b.x - d.x) < t.w / 2 + 4 && Math.abs(b.y - d.y) < t.h / 2 + 6) {
        b.dead = true;
        S.hits++;
        d.hp--;
        if (d.hp <= 0) { d.dead = true; killEnemy(d.type, d.x, d.y); }
        else { d.flash = 0.1; sfx('hit'); }
        break;
      }
    }
    if (b.dead) continue;
    for (const be of beers) {
      if (be.dead) continue;
      const t = ETYPES.beer, bx = beerX(be);
      if (Math.abs(b.x - bx) < t.w / 2 + 4 && Math.abs(b.y - be.y) < t.h / 2 + 6) {
        b.dead = true;
        S.hits++;
        be.hp--;
        if (be.hp <= 0) { be.dead = true; killEnemy('beer', bx, be.y); }
        else { be.flash = 0.1; sfx('hit'); }
        break;
      }
    }
    if (b.dead) continue;
    for (const g of groups) {
      for (const c of g.cells) {
        if (!c.alive) continue;
        const t = ETYPES[c.type];
        const p = enemyPos(g, c);
        if (Math.abs(b.x - p.x) < t.w / 2 + 4 && Math.abs(b.y - p.y) < t.h / 2 + 6) {
          b.dead = true;
          S.hits++;
          c.hp--;
          if (c.hp <= 0) { c.alive = false; killEnemy(c.type, p.x, p.y); }
          else { c.flash = 0.1; sfx('hit'); }
          break;
        }
      }
      if (b.dead) break;
    }
  }
  bullets = bullets.filter(b => !b.dead);

  // ---- LÁSER DE LÚPULO: columna devastadora durante unos segundos ----
  if (player.laserT > 0) {
    player.laserT -= dt;
    player.laserTick -= dt;
    const half = 22;

    // desintegra proyectiles enemigos que toquen la columna
    for (const dr of drops) {
      if (Math.abs(dr.x - player.x) < half && dr.y < player.y) dr.dead = true;
    }

    if (player.laserTick <= 0) {
      player.laserTick = 0.1;   // pulso de daño
      if (boss.state === 'fight' &&
          Math.abs(boss.x - player.x) < half + 24 && boss.y < player.y) {
        boss.hp--;
        boss.flash = 0.08;
        if (boss.hp <= 0) defeatBoss();
      }
      for (const d of divers) {
        if (d.dead || Math.abs(d.x - player.x) >= half + 12 || d.y >= player.y) continue;
        d.hp--;
        if (d.hp <= 0) { d.dead = true; killEnemy(d.type, d.x, d.y, true); }
        else d.flash = 0.1;
      }
      for (const be of beers) {
        if (be.dead) continue;
        const bx = beerX(be);
        if (Math.abs(bx - player.x) >= half + 10 || be.y >= player.y) continue;
        be.hp--;
        if (be.hp <= 0) { be.dead = true; killEnemy('beer', bx, be.y, true); }
        else be.flash = 0.1;
      }
      for (const g of groups) {
        for (const c of g.cells) {
          if (!c.alive) continue;
          const p = enemyPos(g, c);
          if (Math.abs(p.x - player.x) >= half + 12 || p.y >= player.y || p.y < -10) continue;
          c.hp--;
          if (c.hp <= 0) { c.alive = false; killEnemy(c.type, p.x, p.y, true); }
          else c.flash = 0.1;
        }
      }
    }

    // el precio del poder: al apagarse quedas con 1 pinta
    if (player.laserT <= 0) {
      S.lives = 1;
      player.invuln = 1.2;
      popups.push({ x: player.x, y: player.y - 44, text: 'EL PRECIO: QUEDA 1 PINTA', life: 1.4 });
    }
  }

  // ---- Daño al jugador ----
  if (player.invuln <= 0) {
    let hit = false;

    // proyectiles enemigos
    for (const dr of drops) {
      if (Math.abs(dr.x - player.x) < player.w / 2 + 4 &&
          Math.abs(dr.y - player.y) < player.h / 2 + 4) {
        dr.dead = true;
        hit = true;
        break;
      }
    }
    // enemigos en picada
    if (!hit) for (const d of divers) {
      if (d.dead) continue;
      const t = ETYPES[d.type];
      if (Math.abs(d.x - player.x) < (t.w + player.w) / 2 - 8 &&
          Math.abs(d.y - player.y) < (t.h + player.h) / 2 - 6) {
        d.dead = true;
        explode(d.x, d.y, PAL.bone, 10);
        hit = true;
        break;
      }
    }
    // cervezas industriales
    if (!hit) for (const be of beers) {
      if (be.dead) continue;
      const t = ETYPES.beer, bx = beerX(be);
      if (Math.abs(bx - player.x) < (t.w + player.w) / 2 - 8 &&
          Math.abs(be.y - player.y) < (t.h + player.h) / 2 - 6) {
        be.dead = true;
        explode(bx, be.y, PAL.greenHi, 10);
        hit = true;
        break;
      }
    }
    // el cuerpo del Rey Hueso
    if (!hit && boss.state === 'fight' &&
        Math.abs(boss.x - player.x) < 44 && Math.abs(boss.y - player.y) < 52) {
      hit = true;
    }
    // formación
    if (!hit) {
      outer:
      for (const g of groups) {
        for (const c of g.cells) {
          if (!c.alive) continue;
          const t = ETYPES[c.type];
          const p = enemyPos(g, c);
          if (Math.abs(p.x - player.x) < (t.w + player.w) / 2 - 8 &&
              Math.abs(p.y - player.y) < (t.h + player.h) / 2 - 6) {
            c.alive = false;
            explode(p.x, p.y, PAL.bone, 10);
            hit = true;
            break outer;
          }
        }
      }
    }
    if (hit) {
      if (player.shieldT > 0) {
        // el escudo de espuma absorbe el golpe
        explode(player.x, player.y - 10, PAL.tealSoft, 8);
        sfx('hit');
      } else {
        hitPlayer();
      }
    }
  }

  // ---- Partículas y textos flotantes ----
  updateFx(dt);
}

function updateFx(dt) {
  for (const pa of particles) {
    pa.x += pa.vx * dt; pa.y += pa.vy * dt;
    pa.vy += 60 * dt;
    pa.life -= dt;
  }
  particles = particles.filter(p => p.life > 0);
  for (const po of popups) { po.y -= 34 * dt; po.life -= dt; }
  popups = popups.filter(p => p.life > 0);
}

// El tiempo se acabó con el Rey Hueso vivo: todo explota
function startCataclysm() {
  S.state = 'boom';
  S.boomT = 2.2;
  S.boomSpawn = 0;
  S.cataclysmed = true;
  bullets = []; drops = []; pickups = [];
  explode(player.x, player.y, PAL.amberHi, 40);
  explode(player.x, player.y, PAL.red, 30);
  popups.push({ x: W / 2, y: 300, text: '¡NOOO! ¡EL LOTE!', life: 2 });
  singularityFlare();
  S.shake = 18;
  MUSIC.stop();
  sfx('barrel');
}

function killEnemy(type, x, y, fromBlast) {
  const t = ETYPES[type];
  S.kills++;
  addScore(t.pts, x, y);
  const col = type === 'beer' ? PAL.greenHi
            : type === 'can' ? PAL.redHi
            : type === 'skull' ? PAL.purple
            : PAL.bone;
  explode(x, y, col, 14);
  sfx('boom');
  // a veces suelta un power-up (no en cadena por el barril)
  if (!fromBlast && Math.random() < CFG.powerDropChance) {
    pickups.push({ x, y, type: pickPowerType(), phase: 0 });
  }
}

function pickPowerType() {
  const r = Math.random();
  if (r < 0.28) return 'hop';
  if (r < 0.56) return 'ipa';
  if (r < 0.74) return 'barrel';
  if (r < 0.90) return 'life';
  return 'shield';   // 10%: el más raro de todos
}

function applyPower(type) {
  const msgs = {
    hop: '¡HOP SHOT!', ipa: '¡TRIPLE IPA!', barrel: '¡BARRIL EXPLOSIVO!',
    life: '+1 PINTA', shield: '¡ESCUDO DE ESPUMA!',
  };
  popups.push({ x: player.x, y: player.y - 44, text: msgs[type], life: 1.2 });
  if (type === 'hop' || type === 'ipa') {
    player.weapon = type;
    player.weaponT = CFG.powerTime;
    sfx('power');
  } else if (type === 'life') {
    S.lives = Math.min(5, S.lives + 1);
    sfx('life');
    // ¡5 pintas al límite! se desata el Láser de Lúpulo
    if (S.lives === 5 && player.laserT <= 0) triggerLaser();
  } else if (type === 'shield') {
    player.shieldT = CFG.shieldTime;
    sfx('power');
  } else if (type === 'barrel') {
    barrelBlast();
  }
}

// El súper poder: 5 pintas desatan el láser... y te dejan con 1
function triggerLaser() {
  player.laserT = CFG.laserTime;
  player.laserTick = 0;
  popups.push({ x: player.x, y: player.y - 70, text: '¡LÁSER DE LÚPULO!', life: 1.6 });
  popups.push({ x: player.x, y: player.y - 50, text: '¡5 PINTAS AL LÍMITE!', life: 1.6 });
  S.shake = 10;
  sfx('laser');
}

// El barril explosivo: limpia la pantalla de enemigos
function barrelBlast() {
  S.flashT = 0.18;
  S.shake = 12;
  sfx('barrel');
  for (const g of groups) {
    for (const c of g.cells) {
      if (!c.alive) continue;
      const p = enemyPos(g, c);
      if (p.y > -20) { c.alive = false; killEnemy(c.type, p.x, p.y, true); }
    }
  }
  for (const d of divers) {
    if (!d.dead) { d.dead = true; killEnemy(d.type, d.x, d.y, true); }
  }
  for (const be of beers) {
    if (!be.dead) { be.dead = true; killEnemy('beer', beerX(be), be.y, true); }
  }
  for (const dr of drops) dr.dead = true;   // borra proyectiles enemigos
  if (boss.state === 'fight') {
    boss.hp -= 6;
    boss.flash = 0.15;
    if (boss.hp <= 0) defeatBoss();
  }
}

function defeatBoss() {
  boss.state = 'dead';
  S.kills++;
  S.bossKilled = true;
  S.bossTimeLeft = Math.max(0, Math.ceil(S.matchLeft));   // tiempo de sobra = bonus al final
  const bossPts = DOUBLE_POINTS ? 1500 : 750;   // 500 del jefe + 250 de bonus
  S.score += bossPts;
  popups.push({ x: boss.x, y: boss.y, text: '+' + bossPts, life: 1.4 });
  popups.push({ x: W / 2, y: boss.y - 55, text: '¡REY HUESO DERROTADO!', life: 1.8 });
  explode(boss.x, boss.y, PAL.purple, 26);
  explode(boss.x, boss.y, '#5a7186', 26);
  explode(boss.x, boss.y, PAL.amberHi, 20);
  singularityFlare();
  S.shake = 14;
  sfx('bossdead');
  MUSIC.set('main');   // vuelta de la victoria con la tonada de la casa

  // la onda expansiva barre a todo enemigo restante: victoria limpia,
  // ya no aparece nada más hasta que termine el reloj
  for (const g of groups) {
    for (const c of g.cells) {
      if (!c.alive) continue;
      const p = enemyPos(g, c);
      if (p.y > -20) { c.alive = false; killEnemy(c.type, p.x, p.y, true); }
    }
  }
  for (const d of divers) {
    if (!d.dead) { d.dead = true; killEnemy(d.type, d.x, d.y, true); }
  }
  for (const be of beers) {
    if (!be.dead) { be.dead = true; killEnemy('beer', beerX(be), be.y, true); }
  }
  for (const dr of drops) dr.dead = true;
}

function addScore(pts, x, y) {
  if (DOUBLE_POINTS) pts *= 2;
  S.score += pts;
  popups.push({ x, y, text: '+' + pts, life: 0.7 });
}

function explode(x, y, color, n) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2;
    const sp = 60 + Math.random() * 160;
    particles.push({
      x, y,
      vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 40,
      life: 0.35 + Math.random() * 0.35, max: 0.7,
      color, size: 2 + Math.random() * 3,
    });
  }
}

function hitPlayer() {
  S.lives--;
  player.invuln = CFG.invulnTime;
  S.noDmgT = 0;   // se corta la racha sin daño
  S.shake = 8;
  sfx('phit');
  explode(player.x, player.y, PAL.amberHi, 20);
  if (S.lives <= 0) endGame(false);
}

// ============================================================
//  Render
// ============================================================
function drawEnemySprite(type, x, y, flash) {
  const t = ETYPES[type];
  const spr = flash > 0 ? t.flash : t.spr;
  const th = curTheme();
  if (th && th.ghost) ctx.globalAlpha = 0.78;   // enemigos fantasmales
  ctx.drawImage(spr, (x - t.spr.width / 2) | 0, (y - t.spr.height / 2) | 0);
  if (th && th.hat) {   // sombrero del evento
    ctx.drawImage(th.hat, (x - th.hat.width / 2) | 0,
                  (y - t.spr.height / 2 - th.hat.height + 5) | 0);
  }
  if (th && th.ghost) ctx.globalAlpha = 1;
}

// Círculo relleno en filas de 2px (look pixelado)
function fillPixelCircle(cx, cy, r, color) {
  ctx.fillStyle = color;
  for (let y = -r; y <= r; y += 2) {
    const half = Math.floor(Math.sqrt(Math.max(0, r * r - y * y)));
    if (half > 0) ctx.fillRect((cx - half) & ~1, (cy + y) & ~1, half * 2, 2);
  }
}

function drawSingularity() {
  const cx = sing.x, cy = sing.y, flare = sing.flare;

  // brazos espirales del disco de acreción (elipse aplanada)
  for (let arm = 0; arm < 2; arm++) {
    for (let r = 12; r <= 34; r += 1.6) {
      const a = sing.angle + r * 0.22 + arm * Math.PI;
      const x = cx + Math.cos(a) * r;
      const y = cy + Math.sin(a) * r * 0.45;
      ctx.globalAlpha = (1 - (r - 12) / 26) * 0.75 + 0.15;
      ctx.fillStyle = r < 18 ? PAL.amberHi : r < 26 ? PAL.amber : PAL.teal;
      ctx.fillRect((x | 0) & ~1, (y | 0) & ~1, 2, 2);
    }
  }

  // materia cayendo en espiral
  ctx.globalAlpha = 0.8;
  ctx.fillStyle = PAL.amberHi;
  for (const de of sing.debris) {
    const x = cx + Math.cos(de.a) * de.r;
    const y = cy + Math.sin(de.a) * de.r * 0.5;
    ctx.fillRect((x | 0) & ~1, (y | 0) & ~1, 2, 2);
  }
  ctx.globalAlpha = 1;

  // horizonte de eventos: halo púrpura pulsante + núcleo negro
  const pr = Math.round(8 + Math.sin(S.time * 2.2) * 1.5 + flare * 22);
  fillPixelCircle(cx, cy, pr + 3, PAL.purple);
  fillPixelCircle(cx, cy, pr, '#000000');

  // erupción (cuando emerge el Rey Hueso): onda expansiva pixelada
  if (flare > 0) {
    const rr = (1 - flare) * 280 + 24;
    for (let a = 0; a < Math.PI * 2; a += 0.09) {
      const x = cx + Math.cos(a) * rr;
      const y = cy + Math.sin(a) * rr * 0.8;
      ctx.globalAlpha = flare * 0.9;
      ctx.fillStyle = PAL.amberHi;
      ctx.fillRect((x | 0) & ~1, (y | 0) & ~1, 3, 3);
      const x2 = cx + Math.cos(a + 0.05) * rr * 0.72;
      const y2 = cy + Math.sin(a + 0.05) * rr * 0.72 * 0.8;
      ctx.globalAlpha = flare * 0.5;
      ctx.fillStyle = PAL.purple;
      ctx.fillRect((x2 | 0) & ~1, (y2 | 0) & ~1, 2, 2);
    }
    ctx.globalAlpha = 1;
  }
}

function drawParallax() {
  // nebulosas al fondo
  ctx.globalAlpha = 0.5;
  for (const nb of nebulas) ctx.drawImage(nb.spr, nb.x | 0, nb.y | 0);
  ctx.globalAlpha = 1;

  drawSingularity();

  // capa lejana: elementos de la etiqueta (máscara, flores, hongos)
  ctx.globalAlpha = 0.45;
  for (const it of bgFar) {
    const sway = Math.sin(it.phase * 0.6) * 4;
    ctx.drawImage(it.spr, (it.x + sway - it.spr.width / 2) | 0, it.y | 0);
  }
  // capa media: insumos y equipo de la cervecería
  ctx.globalAlpha = 0.72;
  for (const it of bgMid) {
    const sway = Math.sin(it.phase * 0.8) * 6;
    ctx.drawImage(it.spr, (it.x + sway - it.spr.width / 2) | 0, it.y | 0);
  }
  // decoración del evento especial (pretzels, calabazas, regalos, nopales)
  ctx.globalAlpha = 0.8;
  for (const it of bgTheme) {
    const sway = Math.sin(it.phase * 0.8) * 6;
    ctx.drawImage(it.spr, (it.x + sway - it.spr.width / 2) | 0, it.y | 0);
  }
  ctx.globalAlpha = 1;

  // clima del evento (nieve / papel picado)
  for (const am of ambient) {
    ctx.fillStyle = am.c;
    ctx.fillRect(am.x | 0, am.y | 0, am.w, am.h);
  }

  // el borracho flotante
  if (drunk.active) {
    const bobY = Math.sin(drunk.phase * 1.4) * 6;
    ctx.globalAlpha = 0.9;
    ctx.drawImage(sprDrunk, (drunk.x - sprDrunk.width / 2) | 0, (drunk.y + bobY) | 0);
    ctx.globalAlpha = 1;
  }
}

function draw() {
  ctx.save();
  if (S.shake > 0) {
    ctx.translate((Math.random() - 0.5) * S.shake, (Math.random() - 0.5) * S.shake);
  }

  // ---- Fondo (el evento activo cambia los colores) ----
  const th = curTheme();
  const grd = ctx.createLinearGradient(0, 0, 0, H);
  grd.addColorStop(0, th ? th.bgTop : PAL.dark);
  grd.addColorStop(1, th ? th.bgBottom : PAL.bgTeal);
  ctx.fillStyle = grd;
  ctx.fillRect(-10, -10, W + 20, H + 20);

  ctx.fillStyle = PAL.teal;
  for (const st of stars) ctx.fillRect(st.x | 0, st.y | 0, st.s, st.s);

  drawParallax();

  for (const b of bubbles) {
    const bx = b.x + Math.sin(b.drift) * 6;
    ctx.strokeStyle = 'rgba(44,138,168,0.35)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(bx | 0, b.y | 0, b.r, 0, Math.PI * 2);
    ctx.stroke();
  }

  // tinte rojizo de tensión (Rey Hueso en escena / caos final)
  if (S.tension > 0.01) {
    ctx.fillStyle = 'rgba(200,40,30,' + (S.tension * 0.18).toFixed(3) + ')';
    ctx.fillRect(-10, -10, W + 20, H + 20);
  }

  if (S.state === 'title' || S.state === 'name' || S.state === 'fame') {
    if (S.state === 'title') drawTitle();
    else if (S.state === 'name') drawNameBg();
    else drawFame();
    drawMute();
    ctx.restore();
    return;
  }

  // ---- Enemigos en formación ----
  for (const g of groups) {
    for (const c of g.cells) {
      if (!c.alive) continue;
      const p = enemyPos(g, c);
      const bob = Math.sin(S.time * 5 + c.gx * 0.8) * 2;
      drawEnemySprite(c.type, p.x, p.y + bob, c.flash);
    }
  }

  // ---- Enemigos en picada (tiemblan de furia) ----
  for (const d of divers) {
    const wob = Math.sin(S.time * 22) * 3;
    drawEnemySprite(d.type, d.x + wob, d.y, d.flash);
  }

  // ---- Cervezas industriales ----
  for (const be of beers) {
    drawEnemySprite('beer', beerX(be), be.y, be.flash);
  }

  // ---- El Rey Hueso ----
  if (boss.state === 'enter' || boss.state === 'fight') {
    const spr = boss.flash > 0 ? sprBossFlash : sprBoss;
    const s = boss.scale || 1;
    const bw = sprBoss.width * s, bh = sprBoss.height * s;
    ctx.drawImage(spr, (boss.x - bw / 2) | 0, (boss.y - bh / 2) | 0, bw | 0, bh | 0);
  }

  // ---- Power-ups cayendo ----
  for (const pu of pickups) {
    const px = pu.x + Math.sin(pu.phase) * 4;
    fillPixelCircle(px | 0, pu.y | 0, 14, PAL.teal);
    fillPixelCircle(px | 0, pu.y | 0, 11, '#0a2a36');
    const ico = PICKUP_ICONS[pu.type];
    ctx.drawImage(ico, (px - ico.width / 2) | 0, (pu.y - ico.height / 2) | 0);
  }

  // ---- Balas del jugador (el color indica arma y nivel de oleada) ----
  for (const b of bullets) {
    const spr = b.kind === 'hop' ? sprBulletHop
              : b.kind === 'ipa' ? sprBulletIpa
              : sprBulletTiers[b.tier || 0];
    ctx.drawImage(spr, (b.x - spr.width / 2) | 0, (b.y - spr.height / 2) | 0);
  }

  // ---- Proyectiles enemigos (gotas, orbes del jefe, botellazos) ----
  for (const dr of drops) {
    const spr = dr.orb ? sprOrb : dr.btl ? sprBottleBg : sprDrop;
    ctx.drawImage(spr, (dr.x - spr.width / 2) | 0, (dr.y - spr.height / 2) | 0);
  }

  // ---- Láser de Lúpulo: columna de luz verde desde el tarro ----
  if (S.state !== 'boom' && player.laserT > 0) {
    const bx = player.x | 0;
    const topH = (player.y - 18) | 0;
    const wob = Math.sin(S.time * 40) * 6;
    ctx.globalAlpha = 0.35;
    ctx.fillStyle = PAL.green;
    ctx.fillRect(bx - 22 - (wob / 2 | 0), 0, 44 + (wob | 0), topH);
    ctx.globalAlpha = 0.85;
    ctx.fillStyle = PAL.greenHi;
    ctx.fillRect(bx - 13, 0, 26, topH);
    ctx.globalAlpha = 1;
    ctx.fillStyle = PAL.foam;
    ctx.fillRect(bx - 6, 0, 12, topH);
    // chispas de lúpulo a lo largo del rayo
    if (Math.random() < 0.8) {
      particles.push({
        x: bx - 20 + Math.random() * 40, y: Math.random() * topH,
        vx: (Math.random() - 0.5) * 90, vy: -50 - Math.random() * 40,
        life: 0.25, max: 0.25, color: PAL.greenHi, size: 3,
      });
    }
  }

  // ---- Jugador (parpadea si es invulnerable; explotó en el cataclismo) ----
  if (S.state !== 'boom' && (player.invuln <= 0 || Math.floor(S.time * 12) % 2 === 0)) {
    const sprP = sprPlayers[player.styleIdx];
    ctx.drawImage(sprP, (player.x - sprP.width / 2) | 0, (player.y - sprP.height / 2) | 0);
  }

  // burbuja del escudo de espuma (parpadea cuando está por acabarse)
  if (S.state !== 'boom' && player.shieldT > 0 &&
      (player.shieldT > 1.5 || Math.floor(S.time * 8) % 2 === 0)) {
    const rr = 27 + Math.sin(S.time * 6) * 2;
    for (let a = 0; a < Math.PI * 2; a += 0.22) {
      const x = player.x + Math.cos(a) * rr;
      const y = player.y - 2 + Math.sin(a) * rr;
      ctx.globalAlpha = 0.75;
      ctx.fillStyle = (a * 10 | 0) % 3 === 0 ? PAL.foam : PAL.tealSoft;
      ctx.fillRect((x | 0) & ~1, (y | 0) & ~1, 3, 3);
    }
    ctx.globalAlpha = 1;
  }

  // ---- Partículas ----
  for (const pa of particles) {
    ctx.globalAlpha = Math.max(0, pa.life / pa.max);
    ctx.fillStyle = pa.color;
    ctx.fillRect(pa.x | 0, pa.y | 0, pa.size, pa.size);
  }
  ctx.globalAlpha = 1;

  // ---- Textos flotantes ----
  for (const po of popups) {
    ctx.globalAlpha = Math.min(1, po.life * 2);
    drawText(po.text, po.x, po.y, 2, PAL.amberHi, 'center');
  }
  ctx.globalAlpha = 1;

  // destello blanco del barril explosivo
  if (S.flashT > 0) {
    ctx.globalAlpha = Math.min(1, S.flashT * 4);
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, W, H);
    ctx.globalAlpha = 1;
  }

  drawHUD();
  if (S.state === 'end') drawEnd();
  drawMute();
  ctx.restore();
}

function drawHUD() {
  drawText('PUNTOS ' + String(S.score).padStart(6, '0'), 12, 14, 2, PAL.foam);
  drawText('OLEADA ' + S.wave, 12, 34, 2, PAL.tealSoft);
  if (DOUBLE_POINTS) drawText('¡PUNTOS DOBLES!', 12, 52, 1, PAL.yellow);

  // tiempo al centro (rojo parpadeante en los últimos 10s)
  const t = Math.max(0, Math.ceil(S.matchLeft));
  const timeCol = t <= 10 && S.state === 'playing' && (Math.floor(S.time * 3) % 2 === 0) ? PAL.red : PAL.amberHi;
  drawText('0:' + String(t).padStart(2, '0'), W / 2, 12, 3, timeCol, 'center');

  // pintas a la derecha
  for (let i = 0; i < S.lives; i++) {
    ctx.drawImage(sprLifes[player.styleIdx], W - 28 - i * 24, 10);
  }

  // barra de vida del Rey Hueso
  if (boss.state === 'fight') {
    const bw = 220, bx = W / 2 - bw / 2, by = 56;
    drawText('REY HUESO', W / 2, by - 10, 1, PAL.redHi, 'center');
    ctx.fillStyle = 'rgba(4,20,28,0.7)';
    ctx.fillRect(bx - 2, by - 2, bw + 4, 10);
    ctx.fillStyle = PAL.red;
    ctx.fillRect(bx, by, Math.max(0, bw * boss.hp / CFG.bossHp), 6);
  }

  // power-ups activos (abajo a la izquierda, con barra de tiempo)
  let py = H - 34;
  if (player.weaponT > 0) {
    const ico = player.weapon === 'hop' ? icoHop : icoFire;
    ctx.drawImage(ico, 12, py);
    ctx.fillStyle = 'rgba(4,20,28,0.7)';
    ctx.fillRect(38, py + 8, 44, 6);
    ctx.fillStyle = PAL.amberHi;
    ctx.fillRect(38, py + 8, 44 * player.weaponT / CFG.powerTime, 6);
    py -= 28;
  }
  if (player.shieldT > 0) {
    ctx.drawImage(icoShield, 12, py);
    ctx.fillStyle = 'rgba(4,20,28,0.7)';
    ctx.fillRect(38, py + 8, 44, 6);
    ctx.fillStyle = PAL.tealSoft;
    ctx.fillRect(38, py + 8, 44 * player.shieldT / CFG.shieldTime, 6);
  }
}

function drawTitle() {
  const blink = Math.floor(S.time * 2) % 2 === 0;

  // logo pixelizado flotando suavemente
  if (logoReady) {
    const bob = Math.sin(S.time * 1.5) * 3;
    ctx.drawImage(logoCvs, (W / 2 - 56) | 0, (24 + bob) | 0, 112, 112);
  }

  drawText('SIN HUESO! PRESENTA', W / 2, 150, 2, PAL.tealSoft, 'center');

  drawText('HOP', W / 2, 195, 9, PAL.amber, 'center');
  drawText('INVADERS', W / 2, 255, 9, PAL.amberHi, 'center');

  // edición especial activa
  const th = curTheme();
  if (th) {
    drawText(th.banner || ('★ EDICIÓN ' + th.label + ' ★'), W / 2, 318, 2, PAL.amberHi, 'center');
  }

  drawText('LAS CERVEZAS SIN SABOR HAN INVADIDO.', W / 2, 340, 2, PAL.foam, 'center');
  drawText('DEFIENDE EL ÚLTIMO LOTE ARTESANAL.', W / 2, 362, 2, PAL.foam, 'center');

  // evento ráfaga (parpadea para que nadie se lo pierda)
  if (DOUBLE_POINTS && blink) {
    drawText('★ ¡HOY PUNTOS DOBLES! ★', W / 2, 388, 2, PAL.yellow, 'center');
  }

  // tabla de enemigos y puntos (clásico arcade)
  const rowsY = [415, 452, 492, 540];
  const sprs = ['bone', 'skull', 'can', 'beer'];
  const labels = ['10 PTS', '25 PTS', '40 PTS', '50 PTS'];
  for (let i = 0; i < 4; i++) {
    const t = ETYPES[sprs[i]];
    ctx.drawImage(t.spr, (W / 2 - 55 - t.spr.width / 2) | 0, (rowsY[i] - t.spr.height / 2) | 0);
    drawText(labels[i], W / 2 - 10, rowsY[i] - 5, 2, PAL.foam);
  }

  if (blink) {
    drawText('▶ TOCA PARA JUGAR', W / 2, 610, 3, PAL.amberHi, 'center');
  }

  drawText('MUEVE CON ← → O ARRASTRA EL DEDO', W / 2, 656, 2, PAL.teal, 'center');
  drawText('DISPARO AUTOMÁTICO', W / 2, 674, 2, PAL.teal, 'center');

  if (S.best > 0) {
    drawText('RÉCORD ' + S.best, W / 2, 700, 2, PAL.tealSoft, 'center');
  }
}

// Botón de silencio (esquina inferior derecha, todas las pantallas)
function drawMute() {
  const x = W - 44, y = H - 44;
  ctx.fillStyle = 'rgba(4,20,28,0.6)';
  ctx.fillRect(x, y, 34, 34);
  ctx.strokeStyle = PAL.teal;
  ctx.lineWidth = 2;
  ctx.strokeRect(x + 1, y + 1, 32, 32);
  ctx.fillStyle = SND.muted ? PAL.teal : PAL.amberHi;
  ctx.fillRect(x + 7, y + 14, 5, 7);    // bocina
  ctx.fillRect(x + 12, y + 11, 4, 13);
  if (SND.muted) {
    drawText('X', x + 21, y + 13, 2, PAL.red);
  } else {
    ctx.fillRect(x + 20, y + 13, 2, 9);  // ondas
    ctx.fillRect(x + 24, y + 10, 2, 15);
  }
}

// Fondo de la pantalla de captura de nombre (el overlay HTML va encima)
function drawNameBg() {
  drawText('★ SALÓN DE LA FAMA ★', W / 2, 120, 3, PAL.amberHi, 'center');
  drawText('PUNTAJE: ' + S.score, W / 2, 170, 2, PAL.foam, 'center');
}

// El Salón de la Fama con pestañas por periodo
function drawFame() {
  drawText('★ SALÓN DE LA FAMA ★', W / 2, 60, 3, PAL.amberHi, 'center');

  // pestañas
  const tw = 106, th = 30, ty = 116;
  const tx0 = (W - tw * 4 - 12) / 2;
  for (let i = 0; i < 4; i++) {
    const tx = tx0 + i * (tw + 4);
    ctx.fillStyle = i === fameTab ? PAL.amber : 'rgba(13,59,79,0.85)';
    ctx.fillRect(tx, ty, tw, th);
    drawText(FAME_TABS[i], tx + tw / 2, ty + 10, 2, i === fameTab ? PAL.dark : PAL.tealSoft, 'center');
  }

  // periodo de la pestaña; si no hay conexión, el aviso ocupa su lugar
  // porque importa más saber que el ranking es solo de este dispositivo
  if (fameOffline) {
    drawText('SIN CONEXIÓN · RANKING SOLO DE ESTE DISPOSITIVO', W / 2, 158, 1, PAL.red, 'center');
  } else {
    drawText(famePeriodLabel(fameTab), W / 2, 158, 1, PAL.tealSoft, 'center');
  }

  const list = fameList;
  if (list === null) {
    if (Math.floor(S.time * 3) % 2 === 0) {
      drawText('CARGANDO...', W / 2, 300, 2, PAL.tealSoft, 'center');
    }
  } else if (list.length === 0) {
    drawText('AÚN NO HAY PUNTAJES', W / 2, 290, 2, PAL.foam, 'center');
    drawText('¡SÉ LA PRIMERA LEYENDA!', W / 2, 315, 2, PAL.tealSoft, 'center');
  } else {
    for (let i = 0; i < Math.min(10, list.length); i++) {
      const e = list[i];
      const ry = 178 + i * 34;
      const mine = e.id ? e.id === S.lastRemoteId : e.t === S.lastSaveId;
      if (mine) {
        ctx.fillStyle = 'rgba(217,151,30,0.18)';
        ctx.fillRect(28, ry - 7, W - 56, 27);
      }
      const rankCol = i === 0 ? PAL.amberHi : i === 1 ? PAL.foam : i === 2 ? '#c9885a' : PAL.tealSoft;
      drawText(String(i + 1), 44, ry, 2, rankCol, 'right');
      drawText(e.n, 62, ry, 2, mine ? PAL.amberHi : PAL.foam);
      drawText('★'.repeat(e.st || 1), 250, ry, 1, PAL.tealSoft);
      drawText(String(e.s), W - 40, ry, 2, rankCol, 'right');
    }
    // tu mejor puntaje y posición en el periodo
    if (S.lastName) {
      const mine = list.filter(e => e.n === S.lastName);
      if (mine.length > 0) {
        const pos = list.indexOf(mine[0]) + 1;
        drawText('TU MEJOR: ' + mine[0].s + ' · PUESTO #' + pos + ' DE ' + list.length,
                 W / 2, 540, 2, PAL.amberHi, 'center');
      }
    }
  }

  if (Math.floor(S.time * 2) % 2 === 0) {
    drawText('▶ JUGAR DE NUEVO', W / 2, 615, 3, PAL.amberHi, 'center');
  }
  drawText('TOCA UNA PESTAÑA PARA CAMBIAR DE PERIODO', W / 2, 665, 1, PAL.teal, 'center');
}

function drawEnd() {
  ctx.fillStyle = 'rgba(4,20,28,0.82)';
  ctx.fillRect(0, 0, W, H);

  if (S.won) {
    if (S.trollHit) {
      drawText('¡LOTE NO DEFENDIDO!', W / 2, 210, 4, PAL.red, 'center');
      drawText('EL BORRACHO TENÍA OTROS PLANES JAJA', W / 2, 245, 2, PAL.tealSoft, 'center');
      drawText('(TRANQUILO: TUS PUNTOS SÍ CUENTAN)', W / 2, 263, 1, PAL.teal, 'center');
    } else {
      drawText('¡LOTE DEFENDIDO!', W / 2, 210, 4, PAL.amberHi, 'center');
    }
  } else if (S.cataclysmed) {
    drawText('EL REY HUESO GANÓ', W / 2, 210, 4, PAL.red, 'center');
    drawText('EL TIEMPO SE ACABÓ Y TODO EXPLOTÓ...', W / 2, 245, 2, PAL.tealSoft, 'center');
  } else {
    drawText('SE PERDIÓ EL LOTE', W / 2, 210, 4, PAL.red, 'center');
    drawText('LAS CERVEZAS SIN SABOR GANARON ESTA VEZ...', W / 2, 245, 2, PAL.tealSoft, 'center');
  }

  // rango de la partida: 1 a 3 estrellas
  const nStars = calcStars();
  for (let i = 0; i < 3; i++) {
    drawText('★', W / 2 - 38 + i * 38, 262, 5, i < nStars ? PAL.amberHi : 'rgba(28,107,133,0.55)', 'center');
  }

  drawText(String(S.score), W / 2, 305, 7, PAL.foam, 'center');
  drawText('PUNTOS', W / 2, 352, 2, PAL.tealSoft, 'center');

  // desglose de bonos
  let by = 372;
  if (S.won) { drawText('BONUS SUPERVIVENCIA +500', W / 2, by, 2, PAL.amberHi, 'center'); by += 17; }
  if (S.bossKilled) { drawText('★ REY HUESO DERROTADO +750 ★', W / 2, by, 2, PAL.amberHi, 'center'); by += 17; }
  if (S.livesBonus > 0) { drawText('PINTAS RESTANTES +' + S.livesBonus, W / 2, by, 2, PAL.amberHi, 'center'); by += 17; }
  if (S.timeBonus > 0) { drawText('TIEMPO DE SOBRA +' + S.timeBonus, W / 2, by, 2, PAL.amberHi, 'center'); by += 17; }

  const acc = Math.min(100, S.shots > 0 ? Math.round(S.hits / S.shots * 100) : 0);
  drawText('ENEMIGOS DERROTADOS: ' + S.kills, W / 2, 448, 2, PAL.foam, 'center');
  drawText('TIEMPO: 0:' + String(Math.min(59, Math.floor(S.survived))).padStart(2, '0'), W / 2, 468, 2, PAL.foam, 'center');
  drawText('PRECISIÓN: ' + acc + '%', W / 2, 488, 2, PAL.foam, 'center');

  if (S.score >= S.best && S.score > 0) {
    drawText('★ ¡NUEVO RÉCORD! ★', W / 2, 520, 2, PAL.amberHi, 'center');
  } else if (S.best > 0) {
    drawText('RÉCORD: ' + S.best, W / 2, 520, 2, PAL.tealSoft, 'center');
  }

  if (S.endCooldown <= 0 && Math.floor(S.time * 2) % 2 === 0) {
    drawText('TOCA PARA CONTINUAR', W / 2, 560, 3, PAL.amberHi, 'center');
  }

  // ---- El borracho trolea la victoria por encima de todo ----
  if (S.troll) {
    const t = S.trollT;
    // entra flotando desde la derecha
    const k = Math.min(1, Math.max(0, (t - 0.8) / 1.8));
    const dX = (W + 40) + (W / 2 + 130 - (W + 40)) * k;
    const dY = 285 + Math.sin(S.time * 2) * 8;
    ctx.drawImage(sprDrunk, (dX - sprDrunk.width / 2) | 0, (dY - sprDrunk.height / 2) | 0);

    // la botella vuela hacia el letrero
    if (t >= 2.55 && !S.trollHit) {
      const bk = Math.min(1, (t - 2.55) / 0.45);
      const bX = dX - 10 + (W / 2 - (dX - 10)) * bk;
      const bY = dY + (225 - dY) * bk;
      ctx.drawImage(sprBottleBg, (bX - sprBottleBg.width / 2) | 0, (bY - sprBottleBg.height / 2) | 0);
    }

    // partículas y textos del ¡PUM! visibles sobre el panel oscuro
    for (const pa of particles) {
      ctx.globalAlpha = Math.max(0, pa.life / pa.max);
      ctx.fillStyle = pa.color;
      ctx.fillRect(pa.x | 0, pa.y | 0, pa.size, pa.size);
    }
    ctx.globalAlpha = 1;
    for (const po of popups) {
      ctx.globalAlpha = Math.min(1, po.life * 2);
      drawText(po.text, po.x, po.y, 3, PAL.amberHi, 'center');
    }
    ctx.globalAlpha = 1;
  }
}

// ============================================================
//  Escalado responsivo y loop principal
// ============================================================
function resize() {
  const scale = Math.min(innerWidth / W, innerHeight / H);
  canvas.style.width = (W * scale) + 'px';
  canvas.style.height = (H * scale) + 'px';
}
addEventListener('resize', resize);
resize();

// Evento activo: por URL para previsualizar (?evento=halloween, ?doble=1),
// o lo que diga Supabase ('auto' = calendario). Sin conexión, el calendario.
const urlParams = typeof location !== 'undefined'
  ? new URLSearchParams(location.search) : new URLSearchParams('');
const urlEvent = urlParams.get('evento');
if (urlParams.get('doble')) DOUBLE_POINTS = true;
if (urlEvent) applyTheme(urlEvent);
else if (DB.client) {
  DB.fetchEvent().then(cfg => {
    applyTheme(cfg.active_event);
    if (!urlParams.get('doble')) DOUBLE_POINTS = !!cfg.double_points;
  }).catch(() => applyTheme('auto'));
} else applyTheme('auto');

// La tonada de la casa suena desde la pantalla de título
// (arranca con el primer toque/tecla: los navegadores exigen un gesto)
MUSIC.set('main');

let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
