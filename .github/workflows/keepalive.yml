# Mantiene despierto el proyecto Free de Supabase: sin actividad por
# ~7 dias se pausa, asi que este ping consulta el ranking 2 veces por
# semana. La llave anon es publica por diseno (RLS protege los datos).
name: keepalive

on:
  schedule:
    - cron: '0 15 * * 1,4'   # lunes y jueves, 15:00 UTC (~9am CDMX)
  workflow_dispatch:          # también se puede disparar a mano

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar el ranking
        run: |
          curl -sf \
            -H "apikey: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhkZ3VwcWtzZ3p6aHRhenRsZG50Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM1NTEzMDUsImV4cCI6MjA5OTEyNzMwNX0.NaGljaeO0o4q7rbmdiEqq6qLnFCIptCIfa98tXYSOhE" \
            "https://hdgupqksgzzhtaztldnt.supabase.co/rest/v1/scores?select=id&limit=1" \
            > /dev/null
          echo "Supabase sigue despierto"
